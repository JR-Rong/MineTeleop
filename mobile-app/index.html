<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176653"><meta name="apple-mobile-web-app-capable" content="yes">
<title>手机授权 · Mine Teleop</title>
<link rel="manifest" href="/mobile/manifest.webmanifest"><link rel="icon" href="/mobile/icon.svg">
<link rel="apple-touch-icon" href="/mobile/icon-192.png">
<link rel="stylesheet" href="/mobile/app.css"><script src="/mobile/app.js" defer></script>
</head>
<body>
<main>
<header><h1>手机授权</h1><button id="logout" class="text-button" hidden>退出</button></header>
<section id="login-panel">
<p class="intro">输入云端配置的审批密码，接收车辆控制申请。</p>
<form id="login-form">
<label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button id="show-password" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<button id="login" class="primary" type="submit">登录</button>
</form>
</section>
<section id="inbox" hidden><h2>待审批</h2><p class="hint">请核对车辆与驾驶员后决定。</p><div id="requests"></div></section>
<p id="message" role="status" aria-live="polite" hidden></p>
<footer id="connection" role="status">请保持页面打开以接收申请。</footer>
</main>
</body>
</html>
