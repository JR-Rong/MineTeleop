vehicle:
  id: vehicle-001
  name: ubuntu-vehicle-field

cloud:
  signaling_url: wss://teleop-field.internal:6000/signaling
  auth_url: https://teleop-field.internal:6000/auth
  device_token_file: device-token
  resolve:
    - teleop-field.internal:6000:60.205.213.254
  ca_bundle: mine-teleop-field-root.crt
  ice_transport_policy: all

runtime:
  control_enabled: true
  media_enabled: true
  control_log_commands: false
  teleop_poll_interval_ms: 500
  media_frame_timeout_ms: 3000
  media_capture_interval_ms: 0

control:
  rate_hz: 20
  max_command_gap_ms: 200
  degraded_timeout_ms: 300
  control_timeout_ms: 800
  timeout_action:
    deceleration_profile:
      - after_ms: 0
        brake: 0.3
      - after_ms: 500
        brake: 0.6
      - after_ms: 1500
        brake: vehicle_defined_max_safe

media:
  realtime_profiles:
    realtime_720p30:
      codec: h264
      encoder: auto
      width: 1280
      height: 720
      fps: 30
      bitrate_kbps: 2500
  record_profiles:
    reuse_realtime:
      codec: h264
      encoder: reuse_realtime
      width: source
      height: source
      fps: source
      bitrate_kbps: 2500
      segment_seconds: 2

cameras:
  - id: front_uvc
    enabled: true
    critical_for_control: true
    reopen_attempts: 3
    reopen_backoff_ms: 500
    device: /dev/v4l/by-id/usb-Generic_USB_Camera_200901010001-video-index0
    capture_width: 1280
    capture_height: 720
    capture_fps: 30
    realtime_profile: realtime_720p30
    record_profile: reuse_realtime
  - id: basler_25192546
    enabled: true
    critical_for_control: true
    reopen_attempts: 3
    reopen_backoff_ms: 500
    device: basler:serial=25192546
    capture_width: 1280
    capture_height: 720
    capture_fps: 30
    realtime_profile: realtime_720p30
    record_profile: reuse_realtime

hardware:
  can:
    interface: can1
    bitrate: 500000
    tx_queue_length: 100
  encoding:
    vaapi_render_device: /dev/dri/renderD128
    dri_card_device: /dev/dri/card1
    preferred_encoder: nvenc
    fallback_encoder: vaapi
    preferred_codec: h264
    fallback_codec: h264
    require_hardware_encoder: true
    max_end_to_end_latency_ms: 200
    min_realtime_fps: 20
  network:
    interface: wlp3s0

field_safety:
  commissioning_mode: bench
  max_speed_kph: 0
  # Analog target-speed proportion gate. Session target speed must remain at
  # or below max_speed_kph * max_throttle.
  max_throttle: 0.10
  # Vehicle-side per-motor hard request ceiling. 300 Nm is a software default,
  # not measured vehicle capability; ordinary code is capped at 640.0 Nm.
  full_scale_motor_torque_nm: 300.0
  # Optional per-motor rising-torque shaping in Nm/s. Zero disables the extra
  # ramp and applies PID output x the acknowledged session torque limit directly.
  # Use a positive value only after isolated bench calibration.
  motor_torque_rise_rate_nm_per_s: 0.0
  # Local 20 ms speed PID parameters. Its [0, 1] output directly scales the
  # acknowledged per-motor session torque limit. These are schema-valid, bounded
  # placeholders only and have NOT passed isolated CAN bench or vehicle calibration;
  # reduce the session torque limit before re-tuning any previously used gains.
  # max_speed_kph: 0 plus the mock adapter is the current traction-enable gate.
  speed_feedback_timeout_ms: 200
  speed_pid_kp: 1.0
  speed_pid_ki: 0.2
  speed_pid_kd: 0.0
  speed_pid_derivative_filter_tau_ms: 100.0
  speed_pid_max_dt_ms: 100
  hard_overspeed_margin_kph: 3.6
  # Vehicle-side ordinary EHB hard ceiling in physical bar. 100 bar is a
  # software default, not a calibrated vehicle value. Ordinary code is capped
  # at 327.6 bar; ESTOP/physical emergency/fault uses 409.5 bar independently.
  max_brake_pressure_bar: 100.0
  max_steering_angle_deg: 5.0
  require_can_feedback_before_control: true
  require_local_estop_reset: true
  require_time_sync: true
  max_time_sync_uncertainty_ms: 25
  time_sync_interval_ms: 30000
  time_sync_samples: 7

recording:
  enabled: false
  root_dir: recordings
  min_free_gb: 1
  delete_uploaded_when_below_free_gb: 0.5
  delete_unuploaded_when_below_free_gb: false

upload:
  enabled: false
  backend: local_archive

# This proves network delivery without energizing a chassis. Replace only after
# a separate CAN/braking safety acceptance has supplied the required evidence.
vehicle_adapter:
  type: mock

# For an isolated JYR010 CAN bench, also set max_speed_kph to a positive
# commissioning value, then replace the vehicle_adapter block above with:
#
# vehicle_adapter:
#   type: can
#   integration:
#     chassis_control:
#       can_interface: can1
#       bridge_library_path: /opt/mine-teleop/lib/vendor/chassis/libmine_teleop_chassis_bridge.so
