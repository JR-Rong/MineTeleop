# Orin Nano CPU/WebRTC bench. Synthetic input and mock adapter; no CAN output.
# Requires GStreamer x264enc, plugins-bad and nice. CPU H.264 is opt-in.
vehicle:
  id: vehicle-001
  name: orin-cpu-test-pattern

cloud:
  signaling_url: ws://127.0.0.1:18765/signaling
  auth_url: http://127.0.0.1:18765/auth
  device_token_file: device-token

runtime:
  control_enabled: true
  media_enabled: true
  control_log_commands: true
  teleop_poll_interval_ms: 50
  media_frame_timeout_ms: 3000
  media_capture_interval_ms: 0

control:
  rate_hz: 20
  max_command_gap_ms: 200
  degraded_timeout_ms: 300
  control_timeout_ms: 800
  timeout_action:
    deceleration_profile:
      - after_ms: 0
        brake: 0.3
      - after_ms: 500
        brake: 0.6
      - after_ms: 1500
        brake: vehicle_defined_max_safe

media:
  realtime_profiles:
    cpu_720p30:
      codec: h264
      encoder: cpu
      width: 1280
      height: 720
      fps: 30
      bitrate_kbps: 2500

cameras:
  - id: front_test
    device: testsrc
    realtime_profile: cpu_720p30

hardware:
  can:
    interface: can0
    bitrate: 500000
  encoding:
    preferred_encoder: cpu
    fallback_encoder: cpu
    preferred_codec: h264
    fallback_codec: h264
    require_hardware_encoder: false
    max_end_to_end_latency_ms: 200
    min_realtime_fps: 20
  network:
    interface: lo

field_safety:
  commissioning_mode: bench
  max_speed_kph: 0
  require_can_feedback_before_control: false
  require_local_estop_reset: true
  require_time_sync: true
  max_time_sync_uncertainty_ms: 25
  time_sync_interval_ms: 30000
  time_sync_samples: 7

recording:
  enabled: false
  root_dir: recordings

upload:
  enabled: false
  backend: local_archive

vehicle_adapter:
  type: mock
