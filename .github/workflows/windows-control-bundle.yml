name: Windows control bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-control-bundle.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "configs/**"
      - "cpp/**"
      - "packaging/windows/**"
      - "protocol/**"
      - "scripts/build/build_windows_control_bundle.ps1"

permissions:
  contents: read

concurrency:
  group: windows-control-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 control bundle
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out MineTeleop
        uses: actions/checkout@v4

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 120deac3062162151622ca4860575a33844ba10b
          path: .vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        env:
          VCPKG_DISABLE_METRICS: "1"
          VCPKG_COMMIT: 120deac3062162151622ca4860575a33844ba10b
        run: |
          $ErrorActionPreference = "Stop"
          $actualCommit = git -C .vcpkg rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualCommit -ne $env:VCPKG_COMMIT) {
            throw "Expected vcpkg $env:VCPKG_COMMIT, got $actualCommit"
          }

          & .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed with exit code $LASTEXITCODE"
          }

      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: |
          $cacheDirectory = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Path $cacheDirectory -Force | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-windows-x64-120deac3062162151622ca4860575a33844ba10b-control-v1

      - name: Build and smoke-test Windows x64 bundle
        shell: pwsh
        env:
          VCPKG_DISABLE_METRICS: "1"
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\build\build_windows_control_bundle.ps1 `
            -Architecture x64 `
            -VcpkgRoot .\.vcpkg `
            -SmokeTest
          if ($LASTEXITCODE -ne 0) {
            throw "Windows control bundle build failed with exit code $LASTEXITCODE"
          }

      - name: Verify packaged checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archives = @(Get-ChildItem -LiteralPath dist -Filter "mine-teleop-control-windows-x64-*.zip" -File)
          if ($archives.Count -ne 1) {
            throw "Expected one Windows x64 ZIP, found $($archives.Count)"
          }

          $checksumPath = "$($archives[0].FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "Missing checksum file: $checksumPath"
          }

          $expectedHash = ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) {
            throw "SHA-256 mismatch for $($archives[0].Name)"
          }

      - name: Upload Windows x64 ZIP and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: mine-teleop-control-windows-x64-${{ github.sha }}
          path: |
            dist/mine-teleop-control-windows-x64-*.zip
            dist/mine-teleop-control-windows-x64-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
